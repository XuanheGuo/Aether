[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-sil"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["scipy==1.17.0", "pytest==8.3.5", "ruff==0.11.13"]

[tool.ruff]
line-length = 100
